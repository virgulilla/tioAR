<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huerto Radar - Tió de Nadal</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .app {
        max-width: 600px;
        margin: auto;
        padding: 12px;
        background: #fff7f0;
      }
      h1 {
        font-size: 24px;
        color: #ff5a5f;
      }
      .radar {
        margin-top: 12px;
        padding: 12px;
        background: #e0f7ff;
        border-radius: 12px;
        text-align: center;
      }
      .acertijo {
        margin-top: 12px;
        padding: 12px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 12px;
        background: #ff5a5f;
        color: white;
        font-weight: 700;
        margin-top: 8px;
        cursor: pointer;
      }
      .letter {
        font-size: 32px;
        font-weight: 700;
        color: #ff5a5f;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
